name: CodSpeed build benchmarks
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "sites/main-site/**"
      # Content-only PRs (blog posts, events, ...) barely move build time; pushes to main still benchmark them
      - "!sites/main-site/src/content/**"
      - "sites/pipelines/**"
      - "astro.config.base.mjs"
      - "bin/satteri/**"
      - "public/pipelines.json"
      - "package.json"
      - "package-lock.json"
      - "bench/**"
  workflow_dispatch:

# Cancel superseded PR runs, but let every push to main finish so it records a baseline
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write # OIDC auth for CodSpeed

jobs:
  benchmarks:
    # walltime needs CodSpeed's bare-metal runners, GitHub-hosted ones are too noisy
    runs-on: codspeed-macro
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        site: [main-site, pipelines]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mode: walltime
          run: npm run bench -- ${{ matrix.site }}
