name: Fix linting from a comment
on:
  issue_comment:
    types: [created] # Add "@nf-core-bot fix linting" as a PR comment to trigger this workflow.

# Adapted from nf-core/actions/.github/workflows/fix-linting.yml. The website
# can't use that reusable workflow directly: its prettier hook loads plugins
# from the repository's own node_modules, and a job that calls a reusable
# workflow can't add an install step of its own.
#
# Three jobs, each holding only what its own steps need:
#   acknowledge  - gates the run on who commented and on whether the pull
#                  request's head branch is protected, then reacts so the
#                  commenter knows it started. Never checks out the pull
#                  request.
#   prepare-fix  - checks out the pull request, installs its node packages,
#                  and runs its lint hooks. Untrusted code: no secrets,
#                  read-only token, no persisted credential, no cache writes.
#   push-fix     - re-checks the pull request head, validates the patch
#                  'prepare-fix' produced, then applies, commits, and pushes
#                  it with the bot's token. Never runs pull request code.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}

permissions: {}

jobs:
  acknowledge:
    name: acknowledge
    if: >-
      github.repository == 'nf-core/website' && github.event.issue.pull_request &&
      contains(github.event.comment.body, '@nf-core-bot fix linting')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # A branch that is not protected only needs write access to push to, so
      # letting its author or a write/admin collaborator trigger the bot grants
      # nothing new. A protected branch blocks even its own author, so only
      # admin is trusted there.
      - name: Require write access, or admin when the head branch is protected
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMENTER: ${{ github.event.comment.user.login }}
          PR_AUTHOR: ${{ github.event.issue.user.login }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          if ! pr_json="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" 2>&1)"; then
            echo "::error::Could not read pull request #${PR_NUMBER}. The permission check could not be completed, so the request is denied. gh said: ${pr_json}"
            exit 1
          fi
          head_repo="$(jq -r '.head.repo.full_name // empty' <<<"$pr_json")"
          head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
          if [ -z "$head_repo" ]; then
            echo "::error::The pull request's head repository is gone (for example a deleted fork). The permission check could not be completed, so the request is denied."
            exit 1
          fi

          if ! branch_json="$(gh api "repos/${head_repo}/branches/${head_ref}" 2>&1)"; then
            echo "::error::Could not read branch protection for '${head_repo}:${head_ref}'. The permission check could not be completed, so the request is denied. gh said: ${branch_json}"
            exit 1
          fi
          protected="$(jq -r '.protected' <<<"$branch_json")"

          if [ "$protected" != "true" ] && [ "$COMMENTER" = "$PR_AUTHOR" ]; then
            echo "Commenter is the pull request author, and the head branch is not protected."
            exit 0
          fi

          if ! permission_json="$(gh api "repos/${REPO}/collaborators/${COMMENTER}/permission" 2>&1)"; then
            echo "::error::Could not determine ${COMMENTER}'s permission on ${REPO}. The permission check could not be completed, so the request is denied. gh said: ${permission_json}"
            exit 1
          fi
          permission="$(jq -r .permission <<<"$permission_json")"
          echo "Commenter '${COMMENTER}' has repository permission: ${permission}. Head branch protected: ${protected}."

          if [ "$protected" = "true" ]; then
            if [ "$permission" = "admin" ]; then
              exit 0
            fi
            echo "::error::${COMMENTER} does not have admin access to ${REPO}. The pull request's head branch '${head_ref}' is protected, so pushing a lint fix to it needs admin, even for the pull request's own author. Ask an admin to run the fix, or push the fix yourself."
            exit 1
          fi

          case "$permission" in
            admin|write)
              exit 0
              ;;
            *)
              echo "::error::${COMMENTER} is not the pull request author and does not have write access to ${REPO}."
              exit 1
              ;;
          esac

      - name: React to the comment
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" -f content='eyes'

  prepare-fix:
    name: prepare-fix
    needs: acknowledge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head-sha: ${{ steps.pr.outputs.head_sha }}
      has-patch: ${{ steps.patch.outputs.has_patch }}
      prek-outcome: ${{ steps.prek.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr checkout "$PR_NUMBER"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # No 'cache: npm' here or on prek below: this job runs pull request
      # code, and a cache it saves would be restored by trusted runs on main.
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      # .prettierrc loads its plugins from the repository's node_modules.
      # --ignore-scripts so installing doesn't run package lifecycle scripts.
      - name: Install prettier plugins
        run: npm ci --ignore-scripts

      # continue-on-error: a lint failure here is the expected reason this
      # workflow runs, not a broken job.
      - name: Run prek
        id: prek
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        continue-on-error: true
        with:
          cache: false

      - name: Create lint fix patch
        id: patch
        if: steps.prek.outcome == 'failure'
        env:
          PATCH_FILE: ${{ runner.temp }}/lint-fix.patch
        run: |
          git add --all
          git diff --cached --binary --full-index --no-ext-diff > "$PATCH_FILE"
          if [ ! -s "$PATCH_FILE" ]; then
            echo "prek failed without producing a fix. See the 'Run prek' step for the hooks that failed."
            exit 1
          fi
          echo "has_patch=true" >> "$GITHUB_OUTPUT"

      - name: Upload lint fix patch
        if: steps.patch.outputs.has_patch == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-fix
          retention-days: 1
          path: ${{ runner.temp }}/lint-fix.patch
          if-no-files-found: error

  push-fix:
    name: push-fix
    needs: prepare-fix
    # Runs even when prepare-fix failed, so it can still report that failure.
    if: ${{ always() && needs.prepare-fix.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        if: needs.prepare-fix.outputs.has-patch == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout exact pull request head
        if: needs.prepare-fix.outputs.has-patch == 'true'
        env:
          EXPECTED_HEAD_SHA: ${{ needs.prepare-fix.outputs.head-sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr checkout "$PR_NUMBER"
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::The pull request head changed after prek ran. The patch no longer describes the current tree."
            exit 1
          fi

      - name: Download lint fix patch
        if: needs.prepare-fix.outputs.has-patch == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lint-fix
          path: ${{ runner.temp }}/lint-fix

      # The last gate before this job applies untrusted diff content: rejects
      # a symlink, an empty or oversized file, a malformed patch, and a patch
      # that no longer applies.
      - name: Validate the patch
        if: needs.prepare-fix.outputs.has-patch == 'true'
        uses: nf-core/actions/actions/validate-patch@7fb34a05569ea1555e81c47c300a817c98501695 # v1
        with:
          patch-path: ${{ runner.temp }}/lint-fix/lint-fix.patch

      - name: Apply the patch
        if: needs.prepare-fix.outputs.has-patch == 'true'
        env:
          PATCH_FILE: ${{ runner.temp }}/lint-fix/lint-fix.patch
        run: git apply --index "$PATCH_FILE"

      - name: Commit and push changes
        id: commit-and-push
        if: needs.prepare-fix.outputs.has-patch == 'true'
        env:
          GH_TOKEN: ${{ secrets.nf_core_bot_auth_token }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The nf_core_bot_auth_token secret is not set. Refusing to push with the default token."
            exit 1
          fi

          gh auth setup-git
          git config user.email "core@nf-co.re"
          git config user.name "nf-core-bot"
          git config push.default upstream
          git status
          # A repository-supplied hook or GPG configuration must not run
          # inside this credentialed job.
          git -c core.hooksPath=/dev/null -c commit.gpgsign=false commit \
            --no-verify -m "[automated] Fix code linting"
          git -c core.hooksPath=/dev/null push --no-verify

      - name: React if there was nothing to fix
        if: needs.prepare-fix.outputs.prek-outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" -f content='+1'

      - name: React if linting errors were fixed
        if: steps.commit-and-push.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" -f content='hooray'

      - name: React and comment if linting was not fixed
        if: ${{ always() && (failure() || needs.prepare-fix.result != 'success') }}
        env:
          ACTOR: ${{ github.actor }}
          COMMENT_ID: ${{ github.event.comment.id }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" -f content='confused'
          gh pr comment "$PR_NUMBER" --body "@${ACTOR} I tried to fix the linting errors, but it didn't work. Please fix them manually.
          See [CI log](${RUN_URL}) for more details."
