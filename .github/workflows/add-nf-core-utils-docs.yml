name: Open PR with nf-core-utils docs based on webhook call
# Called by .github/workflows/website-docs.yml of nf-core/nf-core-utils on each release, as for the nf-core/tools API docs
on:
  workflow_dispatch:
    inputs:
      ref_name:
        description: "The nf-core-utils release tag"
        required: true

jobs:
  nf-core-utils-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout nf-core-utils code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: "nf-core/nf-core-utils"
          ref: ${{ inputs.ref_name }}
          path: "nf-core-utils"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: false

      # The website-docs task of nf-core-utils writes its user docs as docs pages, with their frontmatter.
      # It only needs uv, so mise doesn't install the plugin's own tools (Java, Nextflow, nf-test) for it.
      - name: Copy the docs
        working-directory: nf-core-utils
        env:
          REF_NAME: ${{ inputs.ref_name }}
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: |
          mise trust .
          mise run website-docs --release "$REF_NAME"

      - name: remove nf-core-utils code
        run: rm -rf nf-core-utils

      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          install-only: true

      - name: Run prek
        id: pre-commit
        run: git add . && prek run --all-files
        continue-on-error: true

      - name: Commit & push changes
        id: commit-and-push
        run: |
          git config user.email "core@nf-co.re"
          git config user.name "nf-core-bot"
          git add .
          git status
          git commit -m "[automated] Update nf-core-utils docs for ${{ inputs.ref_name }}"

      - name: Create PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update nf-core-utils docs for ${{inputs.ref_name}}
          title: Update nf-core-utils docs for ${{inputs.ref_name}}
          body: |
            This PR updates the nf-core-utils docs for ${{inputs.ref_name}}.
            Please review the changes and merge if they look good.
          branch: "update-nf-core-utils-docs-${{inputs.ref_name}}"
          delete-branch: true
          base: "main"
          draft: false
