name: Delete Netlify Deploy Previews

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to delete deploy previews for"
        required: true
        type: number

jobs:
  delete-previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: .github/scripts/delete-netlify-previews.py
          sparse-checkout-cone-mode: false

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Delete deploy previews for merged PR
        run: uv run .github/scripts/delete-netlify-previews.py
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
