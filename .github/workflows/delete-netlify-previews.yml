name: Delete Netlify Deploy Previews

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to delete deploy previews for"
        required: true
        type: number

jobs:
  delete-previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts/delete-netlify-previews.py
          sparse-checkout-cone-mode: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Delete deploy previews for merged PR
        run: uv run .github/scripts/delete-netlify-previews.py
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
